<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo das Mãos</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #e8e8e8;
      color: #222;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px 0;
    }
    .screen { display: none; width: 100%; max-width: 700px; padding: 20px; text-align: center; }
    .screen.active { display: block; }
    h1 { font-size: 2.2em; margin-bottom: 8px; }
    h2 { font-size: 1.3em; font-weight: 400; color: #666; margin-bottom: 30px; }
    .section-label { font-size: 1em; color: #555; margin-bottom: 12px; text-align: center; }
    .colors-grid { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-bottom: 30px; }
    .color-circle {
      width: 48px; height: 48px; border-radius: 50%; cursor: pointer;
      border: 3px solid transparent; transition: all 0.2s; position: relative;
    }
    .color-circle:hover { transform: scale(1.15); }
    .color-circle.selected { border-color: #333; transform: scale(1.15); }
    .color-circle.selected::after {
      content: '✓'; position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; font-weight: bold; color: #fff;
      text-shadow: 0 0 4px rgba(0,0,0,0.8);
    }
    .config-row { display: flex; gap: 20px; justify-content: center; align-items: center; margin-bottom: 30px; flex-wrap: wrap; }
    .config-item { text-align: center; }
    .config-item label { display: block; font-size: 0.9em; color: #555; margin-bottom: 6px; }
    .config-item input {
      width: 80px; padding: 10px; text-align: center;
      background: #fff; border: 2px solid #ccc; border-radius: 8px;
      color: #222; font-size: 1.2em; outline: none;
    }
    .config-item input:focus { border-color: #e94560; }
    .btn {
      display: inline-block; padding: 14px 48px; border: none; border-radius: 12px;
      font-size: 1.2em; font-weight: bold; cursor: pointer; transition: all 0.2s;
    }
    .btn:hover { transform: scale(1.05); }
    .btn { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    .btn-start { background: #e94560; color: #fff; }
    .btn-menu { background: #fff; color: #e94560; border: 2px solid #e94560; }
    .btn-again { background: #e94560; color: #fff; }
    .error-msg { color: #e94560; font-size: 0.9em; margin-bottom: 10px; min-height: 1.2em; }

    #game-screen { max-width: 100%; padding: 10px; }
    .game-hud { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; margin-bottom: 10px; }
    .hud-item { font-size: 1.3em; font-weight: bold; }
    .hud-challenge { color: #e94560; }
    .hud-timer { color: #000; font-size: 1.6em; font-variant-numeric: tabular-nums; }
    .timer-bar { height: 6px; background: #ccc; border-radius: 3px; margin: 0 20px 10px; overflow: hidden; }
    .timer-fill { height: 100%; background: #e94560; border-radius: 3px; transition: width 0.3s linear; }

    .hands-container {
      display: flex; justify-content: center; align-items: center;
      padding: 10px; cursor: pointer; user-select: none;
      flex: 1; min-height: 200px;
    }
    .hands-container svg { max-height: 62vh; width: 100%; height: auto; }
    .hands-container:active svg { transform: scale(0.98); }
    #game-screen { display: none; flex-direction: column; min-height: 80vh; }
    #game-screen.active { display: flex; }

    .color-labels { display: flex; justify-content: space-around; margin-top: 12px; padding: 0 40px; }
    .color-label {
      padding: 8px 24px; border-radius: 20px; font-size: 1.1em; font-weight: bold;
      color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    }
    .click-hint { font-size: 0.85em; color: #999; margin-top: 8px; }

    #end-screen h1 { font-size: 3em; margin-bottom: 20px; }
    .end-buttons { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin-top: 30px; }

    .fade-in { animation: fadeIn 0.4s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    .pulse { animation: pulse 0.4s ease; }
    @keyframes pulse { 0% { transform: scale(1); } 30% { transform: scale(1.03); } 100% { transform: scale(1); } }

    .preview-hands { margin-bottom: 10px; }
    .preview-hands svg { max-height: 28vh; width: 100%; height: auto; }
  </style>
</head>

      { hex: '#22C55E', name: 'Verde' },
      { hex: '#EAB308', name: 'Amarelo' },
      { hex: '#F97316', name: 'Laranja' },
      { hex: '#A855F7', name: 'Roxo' },
      { hex: '#EC4899', name: 'Rosa' },
      { hex: '#06B6D4', name: 'Ciano' },
      { hex: '#84CC16', name: 'Lima' },
      { hex: '#F43F5E', name: 'Magenta' },
    ];

    let selectedColors = new Set([0, 1, 2, 3, 4]);
    let totalChallenges = 5;
    let changeTime = 5;
    let currentChallenge = 0;
    let timerId = null;
    let countdownId = null;
    let gameActive = false;

    const grid = document.getElementById('colorsGrid');
    COLORS.forEach((c, i) => {
      const div = document.createElement('div');
      div.className = 'color-circle' + (selectedColors.has(i) ? ' selected' : '');
      div.style.background = c.hex;
      div.title = c.name;
      div.addEventListener('click', () => {
        if (selectedColors.has(i)) selectedColors.delete(i);
        else selectedColors.add(i);
        div.classList.toggle('selected');
        document.getElementById('errorMsg').textContent = '';
      });
      grid.appendChild(div);
    });

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      const el = document.getElementById(id);
      el.classList.add('active', 'fade-in');
      el.addEventListener('animationend', () => el.classList.remove('fade-in'), { once: true });
      window.scrollTo(0, 0);
    }

    function pickTwoColors() {
      const indices = [...selectedColors];
      const i1 = indices[Math.floor(Math.random() * indices.length)];
      let i2;
      do { i2 = indices[Math.floor(Math.random() * indices.length)]; } while (i2 === i1);
      return [COLORS[i1], COLORS[i2]];
    }

    function randomTwoFromAll() {
      const i1 = Math.floor(Math.random() * COLORS.length);
      let i2;
      do { i2 = Math.floor(Math.random() * COLORS.length); } while (i2 === i1);
      return [COLORS[i1], COLORS[i2]];
    }

    function colorHands(leftHex, rightHex) {
      document.getElementById('leftFill').setAttribute('fill', leftHex);
      document.getElementById('rightFill').setAttribute('fill', rightHex);
    }

    function startGame() {
      totalChallenges = parseInt(document.getElementById('inputChallenges').value) || 5;
      changeTime = parseInt(document.getElementById('inputTime').value) || 10;
      currentChallenge = 0;
      gameActive = true;
      stopPreview();
      showScreen('game-screen');
      nextChallenge();
    }

    function nextChallenge() {
      clearTimeout(timerId);
      clearInterval(countdownId);

      currentChallenge++;
      if (currentChallenge > totalChallenges) {
        gameActive = false;
        showScreen('end-screen');
        return;
      }

      const [c1, c2] = pickTwoColors();
      colorHands(c1.hex, c2.hex);

      const container = document.getElementById('handsContainer');
      container.classList.remove('pulse');
      void container.offsetWidth;
      container.classList.add('pulse');

      document.getElementById('labelLeft').textContent = c1.name;
      document.getElementById('labelLeft').style.background = c1.hex;
      document.getElementById('labelRight').textContent = c2.name;
      document.getElementById('labelRight').style.background = c2.hex;
      document.getElementById('hudChallenge').textContent = currentChallenge + '/' + totalChallenges;

      document.getElementById('hudTimer').textContent = changeTime;
      document.getElementById('timerFill').style.width = '100%';

      const startMs = Date.now();
      const totalMs = changeTime * 1000;

      countdownId = setInterval(() => {
        const elapsed = Date.now() - startMs;
        const left = Math.max(0, Math.ceil((totalMs - elapsed) / 1000));
        document.getElementById('hudTimer').textContent = left;
        document.getElementById('timerFill').style.width = Math.max(0, ((totalMs - elapsed) / totalMs) * 100) + '%';
      }, 100);

      timerId = setTimeout(() => {
        clearInterval(countdownId);
        document.getElementById('hudTimer').textContent = '0';
        document.getElementById('timerFill').style.width = '0%';
        nextChallenge();
      }, totalMs);
    }

    document.getElementById('game-screen').addEventListener('click', () => {
      if (gameActive) nextChallenge();
    });

    document.getElementById('btnStart').addEventListener('click', () => {
      if (selectedColors.size < 2) {
        document.getElementById('errorMsg').textContent = 'Selecione pelo menos 2 cores!';
        return;
      }
      startGame();
    });

    document.getElementById('btnMenu').addEventListener('click', () => {
      gameActive = false;
      clearTimeout(timerId);
      clearInterval(countdownId);
      showScreen('config-screen');
      startPreview();
    });

    document.getElementById('btnAgain').addEventListener('click', () => {
      startGame();
    });

    // Preview animation
    let previewInterval = null;
    function startPreview() {
      function tick() {
        const [c1, c2] = randomTwoFromAll();
        document.getElementById('previewLeft').setAttribute('fill', c1.hex);
        document.getElementById('previewRight').setAttribute('fill', c2.hex);
      }
      tick();
      previewInterval = setInterval(tick, 1200);
    }
    function stopPreview() { clearInterval(previewInterval); }
    startPreview();
  </script>
</body>
</html>
